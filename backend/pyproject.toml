requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
